<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackB Admin</title>
<script src="../theme.js"></script><script src="../shared/api.js" data-root="../"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b2333;--mut:#667085;--line:#e4e7ee;--or:#e5560c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#97a1b5;--line:#2a3347}}
:root[data-theme=dark]{--bg:#0f1420;--card:#171e2e;--tx:#e8ecf5;--mut:#97a1b5;--line:#2a3347}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;align-items:center;gap:14px;padding:14px 22px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}header a,button{font:inherit}
.btn{background:var(--or);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;text-decoration:none;font-weight:600}.btn.o{background:none;color:var(--tx);border:1px solid var(--line)}
main{max-width:1100px;margin:22px auto;padding:0 18px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:7px 14px;cursor:pointer}.tabs button.on{background:var(--or);border-color:var(--or);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.st b{font-size:26px;display:block}.st span{color:var(--mut);font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}table{border-collapse:collapse;width:100%;min-width:640px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}th{color:var(--mut);font-weight:600}
select{font:inherit;padding:5px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}pre{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;font-size:13px}
.empty{padding:30px;text-align:center;color:var(--mut)}
</style></head><body>
<header><h1>TrackB Admin</h1><span id="who" style="color:var(--mut)"></span><a class="btn o" href="../index.html">Website</a><button class="btn" id="out" hidden>Log out</button></header>
<main id="m"><div class="empty">Loading…</div></main>
<script>
const $=s=>document.querySelector(s),E=SB.esc;let tab='stats';
const TABS=[['stats','Overview'],['messages','Messages'],['tickets','Help tickets'],['bookings','Bookings'],['parcels','Parcels'],['newsletter','Newsletter'],['gps','GPS feed']];
const table=(cols,rows)=>rows.length?`<div class="box"><table><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</table></div>`:'<div class="empty box">Nothing here yet.</div>';
async function show(){
 const tabs=`<div class="tabs">${TABS.map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('')}</div>`;let h='';
 try{
 if(tab=='stats'){const s=(await SB.get('/admin/stats')).stats;const L={users:'Travellers',bookings:'Active bookings',revenue:'Revenue (₹)',parcels:'Parcels',newMessages:'New messages',openTickets:'Open tickets',subscribers:'Newsletter',gpsBuses:'Buses sending GPS'};h='<div class="stats">'+Object.keys(L).map(k=>`<div class="st"><b>${Number(s[k]).toLocaleString('en-IN')}</b><span>${L[k]}</span></div>`).join('')+'</div>'}
 if(tab=='messages'){const r=(await SB.get('/admin/messages')).items;h=table([['Ref',x=>x.id],['Topic',x=>E(x.topic)],['From',x=>E(x.name)+'<br><small>'+E(x.email)+'</small>'],['Booking',x=>E(x.booking||'')],['Message',x=>E(x.message)],['Status',x=>`<select data-msg="${x.id}">${['new','replied','closed'].map(s=>`<option${s==x.status?' selected':''}>${s}</option>`).join('')}</select>`]],r)}
 if(tab=='tickets'){const r=(await SB.get('/admin/tickets')).items;h=table([['Ticket',x=>x.id],['Type',x=>E(x.kind)],['Bus / booking',x=>E((x.bus||'')+' '+(x.booking_id||''))],['Note',x=>E(x.message||'')],['When',x=>E(x.created_at)],['Status',x=>`<select data-tk="${x.id}">${['open','resolved'].map(s=>`<option${s==x.status?' selected':''}>${s}</option>`).join('')}</select>`]],r)}
 if(tab=='bookings'){const r=(await SB.get('/admin/bookings')).items;h=table([['ID',x=>x.id],['Traveller',x=>E(x.name)+'<br><small>'+E(x.email)+'</small>'],['Route',x=>E(x.from_city+' → '+x.to_city)+'<br><small>'+x.travel_date+'</small>'],['Bus',x=>E(x.operator)],['Paid',x=>'₹'+x.amount+'<br><small>'+E(x.pay_label)+'</small>'],['Status',x=>x.cancelled?'Cancelled':'Active']],r)}
 if(tab=='parcels'){const r=(await SB.get('/admin/parcels')).items,N=['Booked','Received','Loaded','In transit','Reached','Delivered'];h=table([['ID',x=>x.id],['Sender',x=>E(x.email)],['Route',x=>E(x.from+' → '+x.to)],['Bus',x=>E(x.operator)],['Fare',x=>'₹'+x.fare],['Stage',x=>x.cancelled?'Cancelled':`<select data-pc="${x.id}">${N.map((n,i)=>`<option value="${i}"${i==x.stage?' selected':''}>${n}</option>`).join('')}</select>`]],r)}
 if(tab=='newsletter'){const r=(await SB.get('/admin/newsletter')).items;h=`<p><a class="btn" href="/api/admin/newsletter.csv">Download CSV</a></p>`+table([['Email',x=>E(x.email)],['Subscribed',x=>E(x.created_at)]],r)}
 if(tab=='gps')h=`<p>Real vehicles (or a driver app) report their position here. While a bus has a fix newer than 3 minutes, the live tracking page shows it instead of the schedule.</p><pre>POST /api/tracking/gps
X-GPS-Key: &lt;TRACKB_GPS_KEY from .env&gt;
Content-Type: application/json

{"bus": "hrtc-volvo-1830", "lat": 30.7333, "lng": 76.7794, "speed": 58}</pre>`;
 }catch(e){h='<div class="empty box">'+E(e.message)+'</div>'}
 $('#m').innerHTML=tabs+h}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;show()}});
document.addEventListener('change',async e=>{const d=e.target.dataset;try{
 if(d.msg)await SB.post('/admin/messages/'+d.msg+'/status',{status:e.target.value});
 if(d.tk)await SB.post('/admin/tickets/'+d.tk+'/status',{status:e.target.value});
 if(d.pc)await SB.post('/admin/parcels/'+d.pc+'/stage',{stage:+e.target.value})}catch(err){alert(err.message)}});
$('#out').onclick=()=>SB.logout();
SB.ready.then(u=>{
 if(!u||!u.isAdmin){$('#m').innerHTML=`<div class="empty box"><p>${u?'This page is for the admin account only.':'Please log in with the admin account.'}</p><a class="btn" href="${SB.loginUrl('login')}">${u?'Switch account':'Log in'}</a></div>`;if(u)$('#out').hidden=false;return}
 $('#who').textContent=u.email;$('#out').hidden=false;show()});
</script></body></html>
